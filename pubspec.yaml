name: medicine_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  firebase_storage: ^13.3.0
  flutter_riverpod: ^3.3.1
  image_picker: ^1.1.2
  file_picker: ^11.0.2
  mime: ^2.0.0
  path: ^1.9.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  # Full-bleed icon for iOS and general use.
  image_path: assets/branding/app_icon.png
  # Foreground-only glyph on teal (#0D9488) for sharper Android adaptive icons.
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 21

# Native splash: brand teal only (no icon). Name/tagline shown in [AppSplashScreen].
flutter_native_splash:
  color: "#0D9488"
  android_12:
    color: "#0D9488"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
